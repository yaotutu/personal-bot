      <image x="802.5" y="152.5" width="435" height="435" xlink:href="client/android-icon-foreground.png"/>
    </g>
    <rect x="1240" y="225" width="290" height="290" rx="81" fill="#365368"/>
    <image x="1167.5" y="152.5" width="435" height="435" clip-path="url(#mono-round)" xlink:href="client/android-icon-monochrome.png"/>
    <text x="70" y="555" font-size="17" fill="#617583">1024 px opaque art · platform adds mask</text>
    <text x="445" y="550" font-size="16" fill="#617583">108dp layers / 72dp simulated viewport</text>
    <text x="875" y="550" font-size="16" fill="#617583">108dp layers / 72dp simulated viewport</text>
    <text x="1240" y="550" font-size="16" fill="#617583">108dp / 72dp viewport</text>
    <text x="1240" y="578" font-size="16" fill="#617583">White RGB · feature cutouts</text>
    <path d="M70 600H1530" stroke="#cfdbdf" stroke-width="2"/>
    <text x="70" y="651" font-size="24" font-weight="700">Transparent mascot on surfaces</text>
    <text x="935" y="651" font-size="24" font-weight="700">Web sizes</text>
    <rect x="70" y="685" width="390" height="335" rx="24" fill="#f9fbfd"/>
    <rect x="485" y="685" width="390" height="335" rx="24" fill="#304657"/>
    <image x="98" y="700" width="335" height="305" preserveAspectRatio="xMidYMid meet" xlink:href="mascot/transparent.png"/>
    <image x="513" y="700" width="335" height="305" preserveAspectRatio="xMidYMid meet" xlink:href="mascot/transparent.png"/>
