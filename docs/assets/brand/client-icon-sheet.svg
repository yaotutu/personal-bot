<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1130" viewBox="0 0 1600 1130">
  <defs>
    <clipPath id="ios"><rect x="70" y="225" width="290" height="290" rx="66"/></clipPath>
    <clipPath id="android-circle"><circle cx="590" cy="370" r="145"/></clipPath>
    <clipPath id="android-round"><rect x="875" y="225" width="290" height="290" rx="81"/></clipPath>
    <clipPath id="mono-round"><rect x="1240" y="225" width="290" height="290" rx="81"/></clipPath>
  </defs>
  <rect width="1600" height="1130" fill="#edf2f4"/>
  <g font-family="Avenir, Arial, sans-serif" fill="#223849">
