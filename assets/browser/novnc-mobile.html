<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="pimuse-responsive.js"></script>
  <title>Pi Muse 真实浏览器</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(15, 18, 25, 0.88);
      --panel-strong: rgba(15, 18, 25, 0.96);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f3f6fb;
      --muted: rgba(243, 246, 251, 0.72);
      --accent: #4d9fff;
      --danger: #ff7070;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070b;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
    }

    #screen {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #05070b;
    }

    #screen canvas {
      display: block;
      touch-action: none;
    }

    .status {
      position: fixed;
      left: 50%;
      top: calc(8px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 10;
      max-width: calc(100vw - 96px);
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .status[data-tone="error"] {
      border-color: rgba(255, 112, 112, 0.7);
      color: var(--danger);
      pointer-events: auto;
    }

    .status[data-hidden="true"] { opacity: 0; }

    .controls-toggle {
      position: fixed;
      right: calc(8px + env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      z-index: 12;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.72;
    }

    .controls-toggle[aria-expanded="true"] {
      background: var(--panel-strong);
      border-color: rgba(77, 159, 255, 0.8);
      color: var(--accent);
      opacity: 1;
    }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
      border-top: 1px solid var(--border);
      background: var(--panel-strong);
      backdrop-filter: blur(16px);
    }

    .controls[hidden] { display: none; }

    body[data-toolbar="hidden"] .status,
    body[data-toolbar="hidden"] .controls-toggle,
    body[data-toolbar="hidden"] .controls,
    body[data-toolbar="hidden"] .connect { display: none !important; }

    .key {
      min-width: 0;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
      font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .key:active { background: rgba(77, 159, 255, 0.35); }
    .key-wide { grid-column: span 2; }

    .connect {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform: translate(-50%, -50%);
      min-width: 150px;
      min-height: 44px;
      border: 1px solid rgba(77, 159, 255, 0.75);
      border-radius: 999px;
      background: rgba(77, 159, 255, 0.18);
      color: var(--text);
      font: 700 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #keyboard-input {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      min-width: 1px;
      min-height: 1px;
      border: 0;
      padding: 0;
      opacity: 0.01;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: -1;
      pointer-events: none;
    }

    @media (min-width: 700px) {
      .controls { max-width: 620px; margin-inline: auto; border-radius: 14px 14px 0 0; }
    }
  </style>
</head>
<body>
  <div id="screen" aria-label="真实 Chrome 桌面"></div>
  <div id="status" class="status" role="status" aria-live="polite">正在连接真实浏览器</div>
  <button id="controls-toggle" class="controls-toggle" type="button" aria-expanded="false" aria-controls="controls">按键</button>
  <div id="controls" class="controls" hidden>
    <button class="key key-wide" type="button" data-key="keyboard">键盘</button>
    <button class="key" type="button" data-key="enter">Enter</button>
    <button class="key" type="button" data-key="backspace">⌫</button>
    <button class="key" type="button" data-key="tab">Tab</button>
    <button class="key" type="button" data-key="escape">Esc</button>
    <button class="key" type="button" data-key="left">←</button>
    <button class="key" type="button" data-key="up">↑</button>
    <button class="key" type="button" data-key="down">↓</button>
    <button class="key" type="button" data-key="right">→</button>
  </div>
  <button id="connect" class="connect" type="button" hidden>重新连接</button>
  <textarea id="keyboard-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-hidden="true" tabindex="-1"></textarea>

  <script type="module">
    import RFB from './core/rfb.js';
    import KeyTable from './core/input/keysym.js';
    import { createViewerBridge } from './viewer-bridge.js';
    import { createViewerControls } from './viewer-controls.js';

    const screen = document.getElementById('screen');
    const status = document.getElementById('status');
    const connectButton = document.getElementById('connect');
    const controlsToggle = document.getElementById('controls-toggle');
    const controls = document.getElementById('controls');
    const keyboardInput = document.getElementById('keyboard-input');
    const sentinel = '_'.repeat(99);
    let lastKeyboardInput = sentinel;
    let rfb;
    let statusTimer;
    let composing = false;
    let reconnectPending = false;

    function settings() {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      const merged = new URLSearchParams(hash);
      for (const [key, value] of query) if (!merged.has(key)) merged.set(key, value);
      return merged;
    }

    function websocketUrl() {
      const values = settings();
      const host = values.get('host') || window.location.hostname;
      const rawPort = values.get('port') ?? window.location.port;
      // 同源 /browser/desktop/ 前缀下默认走服务端桌面网关；保留 path 覆盖便于独立 noVNC 部署。
      const fallback = window.location.pathname.includes('/browser/desktop/')
        ? 'browser/desktop/websockify'
        : 'websockify';
      const path = (values.get('path') || fallback).replace(/^\/+/, '');
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const port = rawPort ? `:${rawPort}` : '';
      return `${protocol}://${host}${port}/${path}`;
    }

    function connectionPassword() {
      const values = settings();
      return values.get('password') ?? values.get('passwd') ?? '';
    }

    function setStatus(text, tone = 'normal', autoHide = false) {
      clearTimeout(statusTimer);
      status.textContent = text;
      status.dataset.tone = tone;
      status.dataset.hidden = 'false';
      if (autoHide) statusTimer = setTimeout(() => {
        status.dataset.hidden = 'true';
      }, 1600);
    }

    function connect() {
      if (rfb) rfb.disconnect();
      screen.replaceChildren();
      connectButton.hidden = true;
      setStatus('正在连接真实浏览器');
      const next = new RFB(screen, websocketUrl());
      rfb = next;
      next.addEventListener('connect', () => {
        if (rfb !== next) return;
        setStatus('已连接', 'normal', true);
      });
      next.addEventListener('disconnect', (event) => {
        if (rfb !== next) return;
        const clean = event.detail?.clean === true;
        setStatus(clean ? '连接已断开' : '连接中断，请点击重新连接', 'error');
        connectButton.hidden = false;
        rfb = undefined;
        if (reconnectPending) {
          reconnectPending = false;
          bridge.dispatch('connect').catch(showError);
        }
      });
      next.addEventListener('credentialsrequired', () => onCredentialsRequired(next));
      next.addEventListener('desktopname', (event) => {
        if (rfb === next && event.detail?.name) setStatus(`已连接：${event.detail.name}`, 'normal', true);
      });
      next.viewOnly = controlsAdapter.getState().viewOnly;
      next.scaleViewport = controlsAdapter.getState().viewportMode === 'scale';
      next.clipViewport = controlsAdapter.getState().viewportMode === 'clip';
      next.focusOnClick = document.activeElement !== keyboardInput;
      controlsAdapter.bindRfb(next);
    }

    function onCredentialsRequired(target) {
      const password = connectionPassword();
      if (!password || rfb !== target) {
        setStatus('VNC 服务要求密码，请在链接中添加 password 参数', 'error');
        connectButton.hidden = false;
        return;
      }
      setStatus('正在验证 VNC 密码');
      target.sendCredentials({ password });
    }

    function resetKeyboardInput() {
      keyboardInput.value = sentinel;
      lastKeyboardInput = sentinel;
    }

    function showError(error) {
      setStatus(error?.message || '操作失败', 'error');
    }

    // input 是 IME 文本的唯一发送入口。组合期间不发送中间值，末尾按 Unicode code point 比较。
    function sendKeyboardInput() {
      if (composing) return;
      const before = Array.from(lastKeyboardInput);
      const after = Array.from(keyboardInput.value);
      let prefix = 0;
      while (prefix < before.length && prefix < after.length && before[prefix] === after[prefix]) prefix += 1;
      let suffix = 0;
      while (suffix < before.length - prefix && suffix < after.length - prefix &&
        before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) suffix += 1;
      const removed = before.length - prefix - suffix;
      const inserted = after.slice(prefix, after.length - suffix).join('');
      lastKeyboardInput = keyboardInput.value;
      if (removed || inserted) {
        try {
          for (let index = 0; index < removed; index += 1) bridge.dispatch('key.send', { keysym: KeyTable.XK_BackSpace, code: 'Backspace' }).catch(showError);
          if (inserted) bridge.dispatch('text.send', { text: inserted }).catch(showError);
        } catch (error) { showError(error); }
      }
      if (after.length > 200 || after.length === 0) resetKeyboardInput();
    }

    const keyMap = {
      enter: [KeyTable.XK_Return, 'Enter'],
      backspace: [KeyTable.XK_BackSpace, 'Backspace'],
      tab: [KeyTable.XK_Tab, 'Tab'],
      escape: [KeyTable.XK_Escape, 'Escape'],
      left: [KeyTable.XK_Left, 'ArrowLeft'],
      up: [KeyTable.XK_Up, 'ArrowUp'],
      down: [KeyTable.XK_Down, 'ArrowDown'],
      right: [KeyTable.XK_Right, 'ArrowRight'],
    };

    const controlsAdapter = createViewerControls({
      viewportMode: 'scale',
      connect,
      disconnect() { rfb?.disconnect(); },
      reconnect() { reconnectPending = true; rfb?.disconnect(); },
      toolbar(visible) { document.body.dataset.toolbar = visible ? 'visible' : 'hidden'; },
      keyboard(visible) {
        if (visible) { resetKeyboardInput(); keyboardInput.focus({ preventScroll: true }); }
        else keyboardInput.blur();
      },
      keyboardVisible() { return document.activeElement === keyboardInput; },
    });
    const bridge = createViewerBridge(controlsAdapter);
    document.body.dataset.toolbar = controlsAdapter.getState().toolbarVisible ? 'visible' : 'hidden';

    // 触摸工具按钮期间维持隐藏输入框焦点，避免按键条意外收起系统键盘。
    controls.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button') && document.activeElement === keyboardInput) event.preventDefault();
    });
    controls.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.key === 'keyboard') {
        bridge.dispatch('keyboard.set', { visible: document.activeElement !== keyboardInput }).catch(showError);
        return;
      }
      const key = keyMap[button.dataset.key];
      if (!key) return;
      bridge.dispatch('key.send', { keysym: key[0], code: key[1] }).catch(showError);
    });

    controlsToggle.addEventListener('click', () => {
      const expanded = controlsToggle.getAttribute('aria-expanded') === 'true';
      controlsToggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      controls.hidden = expanded;
    });

    keyboardInput.addEventListener('compositionstart', () => { composing = true; });
    keyboardInput.addEventListener('compositionend', () => { composing = false; sendKeyboardInput(); });
    keyboardInput.addEventListener('input', sendKeyboardInput);
    keyboardInput.addEventListener('focus', () => {
      if (rfb) rfb.focusOnClick = false;
      controlsAdapter.update({ keyboardVisible: true });
    });
    keyboardInput.addEventListener('blur', () => {
      if (rfb) rfb.focusOnClick = true;
      controlsAdapter.update({ keyboardVisible: false });
    });
    keyboardInput.addEventListener('keydown', (event) => {
      const named = { Enter: 'enter', Backspace: 'backspace', Tab: 'tab', Escape: 'escape',
        ArrowLeft: 'left', ArrowUp: 'up', ArrowDown: 'down', ArrowRight: 'right' }[event.key];
      if (!named || event.isComposing) return;
      event.preventDefault();
      const key = keyMap[named];
      bridge.dispatch('key.send', { keysym: key[0], code: key[1] }).catch(showError);
    });
    connectButton.addEventListener('click', () => bridge.dispatch('reconnect').catch(showError));
    document.addEventListener('gesturestart', (event) => event.preventDefault());
    bridge.dispatch('connect').catch(showError);
  </script>
</body>
</html>
